version: "3"

vars:
  SYSTEM:
    sh: nix eval --impure --raw --expr builtins.currentSystem

tasks:
  b:
    desc: 'Build a package (usage: task b -- zsh)'
    cmds:
      - nix build .#{{.CLI_ARGS}}

  p:
    desc: 'Probe an upstream package unpatched (usage: task p -- [channel] bats, channel defaults to unstable)'
    vars:
      PKG: '{{index (splitArgs .CLI_ARGS) (sub (len (splitArgs .CLI_ARGS)) 1)}}'
      CHANNEL: '{{if gt (len (splitArgs .CLI_ARGS)) 1}}{{index (splitArgs .CLI_ARGS) 0}}{{else}}unstable{{end}}'
    cmds:
      - nix build .#probe.{{.SYSTEM}}.{{.CHANNEL}}.{{.PKG}}
