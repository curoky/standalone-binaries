[containers]
log_driver = "k8s-file"
log_size_max = 10485760
# LSM policy belongs to the host; this bundle uses seccomp without host profiles.
apparmor_profile = "unconfined"
label = false
env_host = false
http_proxy = false

[network]
network_backend = "netavark"
firewall_driver = "nftables"
dns_bind_port = 53
default_network = "podman"
default_rootless_network_cmd = "pasta"
netavark_plugin_dirs = []
[engine]
cgroup_manager = "cgroupfs"
database_backend = "sqlite"
events_logger = "file"
conmon_env_vars = []
conmon_path = []
compose_providers = []
compose_warning_logs = false
hooks_dir = []
cdi_spec_dirs = ["/etc/cdi"]
compat_api_enforce_docker_hub = true
compression_format = "zstd:chunked"
compression_level = 3
image_default_format = "oci"
image_default_transport = "docker://"
pull_policy = "missing"
retry = 3
retry_delay = "2s"
service_timeout = 0
runtime = "crun"
runtime_supports_json = ["crun", "runc"]
runtime_supports_kvm = []
helper_binaries_dir = ["$BINDIR/../libexec/podman"]

[engine.runtimes]
crun = []
runc = []
