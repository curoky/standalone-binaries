# 启动时按宿主机 IPv6 能力，把 conf/networks/podman.json 软链到 conf/networks.d/ 下的
# dualstack.json 或 ipv4.json（两者内部 name 均为 podman）。networks 目录经
# --network-config-dir 注入（该字段不展开环境变量）。

