[containers]
log_driver = "k8s-file"

[network]
network_backend = "netavark"
default_network = "podman"
default_rootless_network_cmd = "pasta"
cni_plugin_dirs = []
netavark_plugin_dirs = []
# bin/podman-server 按宿主机 IPv6 能力，把 conf/networks/podman.json 软链到
# conf/networks.d/ 下的 dualstack.json 或 ipv4.json。network_config_dir 不展开
# 环境变量，因此仍由 wrapper 通过 --network-config-dir 注入。

[engine]
cgroup_manager = "cgroupfs"
database_backend = "sqlite"
events_logger = "file"
conmon_env_vars = []
conmon_path = []
conmonrs_path = []
helper_binaries_dir = []
compose_providers = []
compose_warning_logs = false
hooks_dir = []
cdi_spec_dirs = ["/etc/cdi"]
compat_api_enforce_docker_hub = true
compression_format = "gzip"
compression_level = 5
image_default_format = "oci"
image_default_transport = "docker://"
pull_policy = "missing"
retry = 3
retry_delay = "2s"
service_timeout = 0
runtime = "crun"
runtime_supports_json = ["crun", "runc"]
runtime_supports_kvm = []

[engine.runtimes]
crun = ["crun"]
runc = ["runc"]
