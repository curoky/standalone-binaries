[storage]
driver = "overlay"
transient_store = false
graphroot = "$PODMAN_DATA_DIR/graphroot"
runroot = "$PODMAN_DATA_DIR/runroot"

[storage.options.overlay]
# Native kernel overlay; fuse-overlayfs is not bundled.
mount_program = ""
mountopt = "nodev"

[storage.options.pull_options]
enable_partial_images = "true"
use_hard_links = "false"
