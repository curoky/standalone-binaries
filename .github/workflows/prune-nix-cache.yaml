name: Prune Nix Cache

on:
  workflow_dispatch:

concurrency:
  group: nix-cache-lifecycle
  cancel-in-progress: false

jobs:
  cache-prune:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GITHUB_ACTOR: ${{ github.actor }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: master

      - uses: DeterminateSystems/nix-installer-action@v22
        with:
          summarize: false

      - name: Evaluate all current cache roots
        run: |
          nix eval --accept-flake-config --json .#cacheRoots >"$RUNNER_TEMP/roots.json.tmp"
          mv "$RUNNER_TEMP/roots.json.tmp" "$RUNNER_TEMP/roots.json"

      - uses: actions/setup-go@v7
        with:
          go-version: '1.26'
          cache-dependency-path: go.sum

      - name: Build nixcache
        env:
          CGO_ENABLED: '0'
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          go build -trimpath -ldflags="-s -w" -o "$RUNNER_TEMP/bin/nixcache" ./cmd/nixcache

      - name: Report cache size before prune
        run: |
          before=$("$RUNNER_TEMP/bin/nixcache" size)
          echo "before=$before" >>"$GITHUB_ENV"
          echo "Cache size before prune: $before" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Prune unreachable cache segments
        run: $RUNNER_TEMP/bin/nixcache prune --roots "$RUNNER_TEMP/roots.json" --snapshot-keep 2 --package-retain-days 2 --package-keep 2

      - name: Report cache size after prune
        run: |
          after=$("$RUNNER_TEMP/bin/nixcache" size)
          echo "Cache size after prune: $after" | tee -a "$GITHUB_STEP_SUMMARY"
          echo "Before: ${{ env.before }}" | tee -a "$GITHUB_STEP_SUMMARY"
