name: debug ARM

run-name: debug ARM ${{ inputs.session }} on ${{ inputs.runner }}

on:
  workflow_dispatch:
    inputs:
      runner:
        description: ARM runner
        required: true
        type: choice
        options:
          - ubuntu-24.04-arm
          - macos-26
      session:
        description: Unique session identifier
        required: true
        type: string
      public_key:
        description: Ephemeral SSH public key
        required: true
        type: string

permissions:
  contents: read

jobs:
  debug:
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v7

      - uses: DeterminateSystems/nix-installer-action@v22
        with:
          summarize: false

      - name: Verify ARM64 environment
        shell: bash
        run: |
          set -euo pipefail

          uname -a
          nix --version

          case "$RUNNER_OS" in
            Linux) expected_arch=aarch64 ;;
            macOS) expected_arch=arm64 ;;
            *)
              echo "unsupported runner OS: $RUNNER_OS" >&2
              exit 1
              ;;
          esac

          actual_arch=$(uname -m)
          if [[ "$actual_arch" != "$expected_arch" ]]; then
            echo "expected $RUNNER_OS ARM64 ($expected_arch), got $actual_arch" >&2
            exit 1
          fi

      - name: Install Upterm
        shell: bash
        run: |
          set -euo pipefail

          case "$RUNNER_OS" in
            Linux)
              archive=upterm_linux_arm64.tar.gz
              checksum=a3ade243cd33a3e5518a007ce5ac69d06b01bd988690d2d01d13be9bc61a1f64
              ;;
            macOS)
              archive=upterm_darwin_arm64.tar.gz
              checksum=2863bdd4d8f86e20925121bd9aee269c87e1a84e935b68431dc90cce33e80572
              ;;
          esac

          mkdir -p "$RUNNER_TEMP/upterm-bin"
          curl -fsSL \
            -o "$RUNNER_TEMP/$archive" \
            "https://github.com/owenthereal/upterm/releases/download/v0.33.0/$archive"
          printf '%s  %s\n' "$checksum" "$RUNNER_TEMP/$archive" | shasum -a 256 -c
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP/upterm-bin" upterm
          chmod +x "$RUNNER_TEMP/upterm-bin/upterm"
          echo "UPTERM=$RUNNER_TEMP/upterm-bin/upterm" >>"$GITHUB_ENV"

      - name: Start SSH session
        env:
          SSH_PUBLIC_KEY: ${{ inputs.public_key }}
        run: |
          set -euo pipefail
          umask 077

          if [[ "$SSH_PUBLIC_KEY" == *$'\n'* ]]; then
            echo "SSH public key must contain exactly one line" >&2
            exit 1
          fi

          read -r key_type key_body _ <<<"$SSH_PUBLIC_KEY"
          case "$key_type" in
            ssh-ed25519|sk-ssh-ed25519@openssh.com|ecdsa-sha2-nistp256|ssh-rsa) ;;
            *)
              echo "unsupported SSH public key type" >&2
              exit 1
              ;;
          esac
          if [[ -z "$key_body" ]]; then
            echo "SSH public key body is missing" >&2
            exit 1
          fi

          printf '%s %s\n' "$key_type" "$key_body" >"$RUNNER_TEMP/authorized_keys"
          ssh-keygen -l -f "$RUNNER_TEMP/authorized_keys"

          runtime_dir=$(mktemp -d /tmp/upterm-rt-XXXXXX)
          state_dir=$(mktemp -d "$RUNNER_TEMP/upterm-state-XXXXXX")
          mkdir -p "$state_dir/state" "$state_dir/config"
          session_name="gha-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"

          {
            echo "XDG_RUNTIME_DIR=$runtime_dir"
            echo "XDG_STATE_HOME=$state_dir/state"
            echo "XDG_CONFIG_HOME=$state_dir/config"
            echo "UPTERM_SESSION_NAME=$session_name"
          } >>"$GITHUB_ENV"
          export XDG_RUNTIME_DIR=$runtime_dir
          export XDG_STATE_HOME=$state_dir/state
          export XDG_CONFIG_HOME=$state_dir/config

          cat >"$state_dir/known_hosts" <<'EOF'
          @cert-authority uptermd.upterm.dev ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAICiecex8Dq718eSe1CCLgLvDmI7AagvCtax7brPFWkh4
          EOF

          session_json=$("$UPTERM" host \
            --detach \
            --accept \
            --name "$session_name" \
            --server ssh://uptermd.upterm.dev:22 \
            --known-hosts "$state_dir/known_hosts" \
            --authorized-keys "$RUNNER_TEMP/authorized_keys" \
            --join-timeout 10m \
            -o json)
          jq -r '.sshCommand // empty' <<<"$session_json" >"$RUNNER_TEMP/ssh-command"
          test -s "$RUNNER_TEMP/ssh-command"

      - name: Publish SSH connection
        uses: actions/upload-artifact@v7
        with:
          name: upterm-${{ inputs.session }}
          path: ${{ runner.temp }}/ssh-command
          retention-days: 1

      - name: Wait for SSH session
        timeout-minutes: 110
        run: |
          set -euo pipefail

          while session_json=$("$UPTERM" session info "$UPTERM_SESSION_NAME" -o json 2>/dev/null); do
            if [[ -e "$GITHUB_WORKSPACE/continue" ]]; then
              "$UPTERM" session stop "$UPTERM_SESSION_NAME"
              break
            fi

            status=$(jq -r .status <<<"$session_json")
            case "$status" in
              disconnected|ending|ended) break ;;
            esac
            sleep 5
          done

      - name: Stop SSH session
        if: ${{ always() }}
        run: |
          if [[ -n "${UPTERM:-}" && -n "${UPTERM_SESSION_NAME:-}" ]]; then
            "$UPTERM" session stop "$UPTERM_SESSION_NAME" || true
          fi
          if [[ -n "${XDG_RUNTIME_DIR:-}" && "$XDG_RUNTIME_DIR" == /tmp/upterm-rt-* ]]; then
            rm -rf -- "$XDG_RUNTIME_DIR"
          fi

